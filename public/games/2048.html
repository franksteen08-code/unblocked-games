<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>2048</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: #0f172a;
    color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 16px;
  }
  .header {
    width: 360px;
    max-width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .title {
    font-size: 38px;
    font-weight: 800;
    color: #e2e8f0;
    letter-spacing: -1px;
  }
  .scores {
    display: flex;
    gap: 8px;
  }
  .score-box {
    background: #1e293b;
    padding: 6px 12px;
    border-radius: 8px;
    text-align: center;
    min-width: 65px;
    border: 1px solid #334155;
  }
  .score-label {
    font-size: 10px;
    color: #94a3b8;
    text-transform: uppercase;
    font-weight: 700;
  }
  .score-val {
    font-size: 16px;
    font-weight: 700;
    color: #38bdf8;
  }
  .controls-bar {
    width: 360px;
    max-width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .btn {
    background: #4f46e5;
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    font-size: 13px;
    transition: background 0.15s;
  }
  .btn:hover { background: #4338ca; }
  .instructions {
    font-size: 12px;
    color: #94a3b8;
  }
  #grid-container {
    width: 360px;
    height: 360px;
    max-width: 100%;
    background: #1e293b;
    border-radius: 12px;
    padding: 12px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-gap: 12px;
    position: relative;
    border: 1px solid #334155;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
  }
  .cell {
    background: #334155;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    font-weight: 700;
    transition: transform 0.1s ease, background-color 0.1s ease;
  }
  .cell-2 { background: #e2e8f0; color: #1e293b; }
  .cell-4 { background: #fed7aa; color: #1e293b; }
  .cell-8 { background: #fb923c; color: #ffffff; }
  .cell-16 { background: #f97316; color: #ffffff; }
  .cell-32 { background: #ea580c; color: #ffffff; }
  .cell-64 { background: #dc2626; color: #ffffff; }
  .cell-128 { background: #eab308; color: #ffffff; font-size: 22px; box-shadow: 0 0 10px #eab308; }
  .cell-256 { background: #facc15; color: #1e293b; font-size: 22px; box-shadow: 0 0 12px #facc15; }
  .cell-512 { background: #84cc16; color: #ffffff; font-size: 22px; box-shadow: 0 0 14px #84cc16; }
  .cell-1024 { background: #06b6d4; color: #ffffff; font-size: 18px; box-shadow: 0 0 16px #06b6d4; }
  .cell-2048 { background: #8b5cf6; color: #ffffff; font-size: 18px; box-shadow: 0 0 20px #8b5cf6; }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(15, 23, 42, 0.9);
    border-radius: 12px;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    z-index: 10;
  }
  .overlay.active { display: flex; }
  .overlay h2 { font-size: 28px; font-weight: 800; color: #f8fafc; }
</style>
</head>
<body>
  <div class="header">
    <div class="title">2048</div>
    <div class="scores">
      <div class="score-box">
        <div class="score-label">Score</div>
        <div class="score-val" id="score">0</div>
      </div>
      <div class="score-box">
        <div class="score-label">Best</div>
        <div class="score-val" id="best-score">0</div>
      </div>
    </div>
  </div>
  <div class="controls-bar">
    <span class="instructions">Use <b>Arrow Keys</b> or <b>WASD</b></span>
    <button class="btn" id="restart-btn">New Game</button>
  </div>
  <div id="grid-container">
    <div class="overlay" id="overlay">
      <h2 id="overlay-text">Game Over!</h2>
      <button class="btn" id="try-again-btn">Try Again</button>
    </div>
  </div>

  <script>
    const gridEl = document.getElementById('grid-container');
    const scoreEl = document.getElementById('score');
    const bestScoreEl = document.getElementById('best-score');
    const overlay = document.getElementById('overlay');
    const overlayText = document.getElementById('overlay-text');
    const restartBtn = document.getElementById('restart-btn');
    const tryAgainBtn = document.getElementById('try-again-btn');

    let board = [];
    let score = 0;
    let bestScore = parseInt(localStorage.getItem('2048_best') || '0', 10);
    bestScoreEl.textContent = bestScore;

    function init() {
      board = Array(4).fill(null).map(() => Array(4).fill(0));
      score = 0;
      updateScore(0);
      overlay.classList.remove('active');
      addRandomTile();
      addRandomTile();
      render();
    }

    function addRandomTile() {
      const emptyCells = [];
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          if (board[r][c] === 0) emptyCells.push({r, c});
        }
      }
      if (emptyCells.length === 0) return;
      const {r, c} = emptyCells[Math.floor(Math.random() * emptyCells.length)];
      board[r][c] = Math.random() < 0.9 ? 2 : 4;
    }

    function render() {
      const existingCells = gridEl.querySelectorAll('.cell');
      existingCells.forEach(c => c.remove());

      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          const val = board[r][c];
          const cell = document.createElement('div');
          cell.className = 'cell' + (val > 0 ? ` cell-${val}` : '');
          cell.textContent = val > 0 ? val : '';
          gridEl.appendChild(cell);
        }
      }
    }

    function updateScore(add) {
      score += add;
      scoreEl.textContent = score;
      if (score > bestScore) {
        bestScore = score;
        bestScoreEl.textContent = bestScore;
        localStorage.setItem('2048_best', bestScore);
      }
    }

    function slide(row) {
      let filtered = row.filter(val => val !== 0);
      let gained = 0;
      for (let i = 0; i < filtered.length - 1; i++) {
        if (filtered[i] === filtered[i + 1]) {
          filtered[i] *= 2;
          gained += filtered[i];
          filtered[i + 1] = 0;
        }
      }
      filtered = filtered.filter(val => val !== 0);
      while (filtered.length < 4) filtered.push(0);
      return { row: filtered, gained };
    }

    function rotateBoard() {
      const newBoard = Array(4).fill(null).map(() => Array(4).fill(0));
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          newBoard[c][3 - r] = board[r][c];
        }
      }
      board = newBoard;
    }

    function moveLeft() {
      let moved = false;
      let totalGained = 0;
      for (let r = 0; r < 4; r++) {
        const res = slide(board[r]);
        if (res.row.join(',') !== board[r].join(',')) moved = true;
        board[r] = res.row;
        totalGained += res.gained;
      }
      if (moved) {
        updateScore(totalGained);
        addRandomTile();
        render();
        checkGameOver();
      }
    }

    function moveRight() {
      rotateBoard();
      rotateBoard();
      moveLeft();
      rotateBoard();
      rotateBoard();
    }

    function moveUp() {
      rotateBoard();
      rotateBoard();
      rotateBoard();
      moveLeft();
      rotateBoard();
    }

    function moveDown() {
      rotateBoard();
      moveLeft();
      rotateBoard();
      rotateBoard();
      rotateBoard();
    }

    function canMove() {
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          if (board[r][c] === 0) return true;
          if (c < 3 && board[r][c] === board[r][c + 1]) return true;
          if (r < 3 && board[r][c] === board[r + 1][c]) return true;
        }
      }
      return false;
    }

    function checkGameOver() {
      if (!canMove()) {
        overlayText.textContent = 'Game Over!';
        overlay.classList.add('active');
      }
    }

    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); moveUp(); }
      if (['ArrowDown', 'KeyS'].includes(e.code)) { e.preventDefault(); moveDown(); }
      if (['ArrowLeft', 'KeyA'].includes(e.code)) { e.preventDefault(); moveLeft(); }
      if (['ArrowRight', 'KeyD'].includes(e.code)) { e.preventDefault(); moveRight(); }
    });

    let touchStartX = 0, touchStartY = 0;
    window.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, {passive: true});

    window.addEventListener('touchend', (e) => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 30) moveRight();
        else if (dx < -30) moveLeft();
      } else {
        if (dy > 30) moveDown();
        else if (dy < -30) moveUp();
      }
    }, {passive: true});

    restartBtn.addEventListener('click', init);
    tryAgainBtn.addEventListener('click', init);
    init();
  </script>
</body>
</html>
