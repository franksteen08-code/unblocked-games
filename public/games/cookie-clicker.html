<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Cookie Clicker Empire</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: #0f172a;
    color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
  }
  .app-wrap {
    display: flex;
    gap: 20px;
    width: 640px;
    max-width: 100%;
    background: #1e293b;
    border-radius: 14px;
    padding: 20px;
    border: 1px solid #334155;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .cookie-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
  }
  .stats-col {
    width: 280px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 440px;
    overflow-y: auto;
    padding-right: 4px;
  }
  .cookie-btn {
    width: 170px;
    height: 170px;
    background: radial-gradient(circle at 35% 35%, #d97706, #92400e, #78350f);
    border-radius: 50%;
    border: 6px solid #b45309;
    box-shadow: 0 10px 25px rgba(0,0,0,0.6), inset 0 4px 10px rgba(255,255,255,0.2);
    cursor: pointer;
    position: relative;
    transition: transform 0.08s ease;
    margin: 16px 0;
  }
  .cookie-btn:active { transform: scale(0.93); }
  .choc-chip {
    position: absolute;
    background: #451a03;
    border-radius: 50%;
    box-shadow: inset 1px 1px 2px rgba(0,0,0,0.5);
  }
  .c-count { font-size: 28px; font-weight: 800; color: #fbbf24; }
  .cps-count { font-size: 13px; color: #94a3b8; font-weight: 600; }
  .item-card {
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 10px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .item-card:hover { background: #1e293b; border-color: #64748b; }
  .item-card.disabled { opacity: 0.5; pointer-events: none; }
  .item-name { font-size: 13px; font-weight: 700; color: #f1f5f9; }
  .item-desc { font-size: 11px; color: #94a3b8; }
  .item-cost { font-size: 12px; font-weight: 700; color: #fbbf24; }
  .item-qty { font-size: 14px; font-weight: 800; color: #38bdf8; min-width: 24px; text-align: right; }
  .float-num {
    position: absolute;
    color: #fbbf24;
    font-weight: 800;
    font-size: 18px;
    pointer-events: none;
    animation: floatUp 0.8s ease-out forwards;
  }
  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-40px); }
  }
</style>
</head>
<body>
  <div class="app-wrap">
    <div class="cookie-col" id="cookie-col">
      <div class="c-count" id="cookies-display">0 Cookies</div>
      <div class="cps-count" id="cps-display">per second: 0.0</div>

      <div class="cookie-btn" id="big-cookie">
        <div class="choc-chip" style="width:20px; height:18px; top:35px; left:40px;"></div>
        <div class="choc-chip" style="width:24px; height:22px; top:80px; left:25px;"></div>
        <div class="choc-chip" style="width:26px; height:24px; top:45px; left:95px;"></div>
        <div class="choc-chip" style="width:22px; height:20px; top:110px; left:80px;"></div>
        <div class="choc-chip" style="width:20px; height:18px; top:90px; left:125px;"></div>
      </div>

      <button id="reset-btn" style="background:#334155; border:none; color:#cbd5e1; padding:4px 10px; border-radius:6px; font-size:11px; cursor:pointer;">Reset Progress</button>
    </div>

    <div class="stats-col" id="shop-list">
      <!-- Upgrades inserted via JS -->
    </div>
  </div>

  <script>
    let cookies = parseFloat(localStorage.getItem('cc_cookies') || '0');
    let clickPower = 1;

    const items = [
      { id: 'cursor', name: 'Auto-Clicker', cost: 15, cps: 0.2, qty: 0, desc: '+0.2 cps' },
      { id: 'grandma', name: 'Grandma', cost: 100, cps: 1.5, qty: 0, desc: '+1.5 cps' },
      { id: 'farm', name: 'Cookie Farm', cost: 1100, cps: 12, qty: 0, desc: '+12 cps' },
      { id: 'mine', name: 'Chocolate Mine', cost: 12000, cps: 65, qty: 0, desc: '+65 cps' },
      { id: 'factory', name: 'Mega Factory', cost: 130000, cps: 350, qty: 0, desc: '+350 cps' },
      { id: 'portal', name: 'Quantum Oven', cost: 1400000, cps: 2200, qty: 0, desc: '+2.2k cps' }
    ];

    // Restore quantities
    items.forEach(it => {
      it.qty = parseInt(localStorage.getItem(`cc_${it.id}`) || '0', 10);
      it.cost = Math.floor(it.cost * Math.pow(1.15, it.qty));
    });

    const cookiesDisplay = document.getElementById('cookies-display');
    const cpsDisplay = document.getElementById('cps-display');
    const bigCookie = document.getElementById('big-cookie');
    const shopList = document.getElementById('shop-list');
    const cookieCol = document.getElementById('cookie-col');
    const resetBtn = document.getElementById('reset-btn');

    function getTotalCps() {
      return items.reduce((acc, it) => acc + (it.cps * it.qty), 0);
    }

    function renderShop() {
      shopList.innerHTML = '';
      items.forEach((it, idx) => {
        const card = document.createElement('div');
        card.className = `item-card ${cookies < it.cost ? 'disabled' : ''}`;
        card.innerHTML = `
          <div>
            <div class="item-name">${it.name}</div>
            <div class="item-desc">${it.desc}</div>
            <div class="item-cost">🍪 ${it.cost.toLocaleString()}</div>
          </div>
          <div class="item-qty">${it.qty}</div>
        `;
        card.onclick = () => buyItem(idx);
        shopList.appendChild(card);
      });
    }

    function buyItem(idx) {
      const it = items[idx];
      if (cookies >= it.cost) {
        cookies -= it.cost;
        it.qty++;
        it.cost = Math.floor(it.cost * 1.15);
        localStorage.setItem(`cc_${it.id}`, it.qty);
        updateUI();
      }
    }

    function updateUI() {
      cookiesDisplay.textContent = `${Math.floor(cookies).toLocaleString()} Cookies`;
      cpsDisplay.textContent = `per second: ${getTotalCps().toFixed(1)}`;
      renderShop();
    }

    bigCookie.addEventListener('click', (e) => {
      cookies += clickPower;
      updateUI();

      // Floating text effect
      const rect = bigCookie.getBoundingClientRect();
      const num = document.createElement('div');
      num.className = 'float-num';
      num.textContent = `+${clickPower}`;
      num.style.left = `${e.clientX - rect.left + 20}px`;
      num.style.top = `${e.clientY - rect.top}px`;
      cookieCol.appendChild(num);
      setTimeout(() => num.remove(), 800);
    });

    setInterval(() => {
      const cps = getTotalCps();
      if (cps > 0) {
        cookies += cps / 10;
        updateUI();
      }
    }, 100);

    // Save every 3s
    setInterval(() => {
      localStorage.setItem('cc_cookies', cookies);
    }, 3000);

    resetBtn.addEventListener('click', () => {
      if (confirm('Reset your cookie empire?')) {
        cookies = 0;
        items.forEach(it => {
          it.qty = 0;
          localStorage.removeItem(`cc_${it.id}`);
        });
        localStorage.removeItem('cc_cookies');
        location.reload();
      }
    });

    updateUI();
  </script>
</body>
</html>
