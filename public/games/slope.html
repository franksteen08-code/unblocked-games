<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Slope Runner</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: #030712;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }
  #game-wrap {
    position: relative;
    width: 640px;
    height: 480px;
    max-width: 100%;
    border-radius: 12px;
    overflow: hidden;
    border: 2px solid #1f2937;
    box-shadow: 0 10px 40px rgba(0,255,200,0.1);
  }
  canvas { background: #030712; display: block; width: 100%; height: 100%; }
  .hud {
    position: absolute;
    top: 16px;
    left: 20px;
    right: 20px;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
  }
  .hud-stat {
    font-size: 20px;
    font-weight: 800;
    color: #00ffcc;
    text-shadow: 0 0 10px rgba(0,255,204,0.6);
  }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(3, 7, 18, 0.85);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }
  .overlay.hidden { display: none; }
  .btn {
    background: #00ffcc;
    color: #030712;
    font-weight: 800;
    border: none;
    padding: 12px 28px;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(0,255,204,0.4);
    transition: transform 0.1s;
  }
  .btn:hover { transform: scale(1.05); }
  .info {
    margin-top: 10px;
    font-size: 13px;
    color: #9ca3af;
  }
</style>
</head>
<body>
  <div id="game-wrap">
    <canvas id="c" width="640" height="480"></canvas>
    <div class="hud">
      <div class="hud-stat" id="score-txt">0 m</div>
      <div class="hud-stat" style="color:#f43f5e;" id="speed-txt">Speed: 1x</div>
    </div>
    <div class="overlay" id="overlay">
      <h1 style="font-size:36px; font-weight:900; color:#00ffcc; letter-spacing:2px;" id="title-txt">SLOPE RUNNER</h1>
      <p style="color:#cbd5e1; font-size:15px;" id="subtitle-txt">Steer the ball to dodge red barriers and avoid falling off!</p>
      <button class="btn" id="start-btn">PLAY</button>
    </div>
  </div>
  <div class="info">Use <b>A / D</b> or <b>Left / Right Arrow</b> or Touch Left/Right to Steer</div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const scoreTxt = document.getElementById('score-txt');
    const speedTxt = document.getElementById('speed-txt');
    const overlay = document.getElementById('overlay');
    const titleTxt = document.getElementById('title-txt');
    const subtitleTxt = document.getElementById('subtitle-txt');
    const startBtn = document.getElementById('start-btn');

    let state = 'MENU';
    let ballX = 0; // -1 to 1 normalized track position
    let ballY = 0;
    let ballRadius = 14;
    let distance = 0;
    let speed = 14;
    let steerVelocity = 0;
    let keys = {};
    let tracks = [];
    let bestScore = parseInt(localStorage.getItem('slope_best') || '0', 10);

    const TRACK_SEGMENTS = 40;
    const SEGMENT_LENGTH = 35;

    function resetGame() {
      ballX = 0;
      steerVelocity = 0;
      distance = 0;
      speed = 14;
      tracks = [];
      for (let i = 0; i < TRACK_SEGMENTS; i++) {
        tracks.push({
          z: i * SEGMENT_LENGTH,
          width: 220,
          obstacles: i > 6 && Math.random() < 0.4 ? [
            { x: (Math.random() * 1.4 - 0.7), w: 0.35, h: 30 }
          ] : []
        });
      }
    }

    window.addEventListener('keydown', e => { keys[e.code] = true; });
    window.addEventListener('keyup', e => { keys[e.code] = false; });

    let touchX = null;
    canvas.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, {passive: true});
    canvas.addEventListener('touchmove', e => {
      if (touchX !== null) {
        const dx = e.touches[0].clientX - touchX;
        ballX += dx * 0.005;
        touchX = e.touches[0].clientX;
      }
    }, {passive: true});
    canvas.addEventListener('touchend', () => { touchX = null; });

    function project(x, y, z) {
      const fov = 300;
      const scale = fov / (fov + z);
      const projX = (x * scale) + canvas.width / 2;
      const projY = (y * scale) + canvas.height / 2 + 60;
      return { x: projX, y: projY, scale };
    }

    function update() {
      if (state !== 'PLAY') return;

      // Steering
      if (keys['ArrowLeft'] || keys['KeyA']) steerVelocity -= 0.003;
      if (keys['ArrowRight'] || keys['KeyD']) steerVelocity += 0.003;

      steerVelocity *= 0.88;
      ballX += steerVelocity;

      // Speed up slowly
      distance += speed * 0.05;
      speed = Math.min(32, 14 + distance * 0.008);

      scoreTxt.textContent = `${Math.floor(distance)} m`;
      speedTxt.textContent = `Speed: ${(speed / 14).toFixed(1)}x`;

      // Fall off
      if (Math.abs(ballX) > 1.05) {
        gameOver('You fell off the track!');
        return;
      }

      // Move track forward
      for (let i = 0; i < tracks.length; i++) {
        tracks[i].z -= speed * 0.35;
      }

      // Check collision with closest segment
      const playerZ = 40;
      for (const t of tracks) {
        if (Math.abs(t.z - playerZ) < SEGMENT_LENGTH * 0.6) {
          for (const obs of t.obstacles) {
            if (Math.abs(ballX - obs.x) < obs.w / 2 + 0.08) {
              gameOver('You crashed into an obstacle!');
              return;
            }
          }
        }
      }

      // Recycle track
      if (tracks[0].z < -SEGMENT_LENGTH) {
        tracks.shift();
        const lastZ = tracks[tracks.length - 1].z;
        const hasObs = Math.random() < Math.min(0.7, 0.35 + distance * 0.0005);
        tracks.push({
          z: lastZ + SEGMENT_LENGTH,
          width: 220,
          obstacles: hasObs ? [
            { x: (Math.random() * 1.4 - 0.7), w: 0.35, h: 30 }
          ] : []
        });
      }
    }

    function gameOver(reason) {
      state = 'GAMEOVER';
      if (distance > bestScore) {
        bestScore = Math.floor(distance);
        localStorage.setItem('slope_best', bestScore);
      }
      titleTxt.textContent = 'CRASHED!';
      titleTxt.style.color = '#f43f5e';
      subtitleTxt.textContent = `${reason} Distance: ${Math.floor(distance)}m (Best: ${bestScore}m)`;
      startBtn.textContent = 'PLAY AGAIN';
      overlay.classList.remove('hidden');
    }

    function draw() {
      ctx.fillStyle = '#030712';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Starfield tunnel lines
      ctx.strokeStyle = '#111827';
      ctx.lineWidth = 1;
      for (let a = 0; a < Math.PI * 2; a += Math.PI / 6) {
        ctx.beginPath();
        ctx.moveTo(canvas.width / 2, canvas.height / 2 + 60);
        ctx.lineTo(
          canvas.width / 2 + Math.cos(a) * 600,
          canvas.height / 2 + 60 + Math.sin(a) * 600
        );
        ctx.stroke();
      }

      // Draw tracks from back to front
      for (let i = tracks.length - 2; i >= 0; i--) {
        const seg1 = tracks[i];
        const seg2 = tracks[i + 1];

        if (seg1.z < 0) continue;

        const p1L = project(-seg1.width / 2, 60, seg1.z);
        const p1R = project(seg1.width / 2, 60, seg1.z);
        const p2L = project(-seg2.width / 2, 60, seg2.z);
        const p2R = project(seg2.width / 2, 60, seg2.z);

        // Track surface
        ctx.fillStyle = (i % 2 === 0) ? '#0f172a' : '#1e293b';
        ctx.beginPath();
        ctx.moveTo(p1L.x, p1L.y);
        ctx.lineTo(p1R.x, p1R.y);
        ctx.lineTo(p2R.x, p2R.y);
        ctx.lineTo(p2L.x, p2L.y);
        ctx.closePath();
        ctx.fill();

        // Neon border edges
        ctx.strokeStyle = '#00ffcc';
        ctx.lineWidth = Math.max(1, 3 * p1L.scale);
        ctx.beginPath();
        ctx.moveTo(p1L.x, p1L.y);
        ctx.lineTo(p2L.x, p2L.y);
        ctx.moveTo(p1R.x, p1R.y);
        ctx.lineTo(p2R.x, p2R.y);
        ctx.stroke();

        // Obstacles
        for (const obs of seg1.obstacles) {
          const obsLeft = project((obs.x - obs.w / 2) * (seg1.width / 2), 60, seg1.z);
          const obsRight = project((obs.x + obs.w / 2) * (seg1.width / 2), 60, seg1.z);
          const obsTop = project((obs.x) * (seg1.width / 2), 60 - obs.h, seg1.z);

          ctx.fillStyle = '#f43f5e';
          ctx.beginPath();
          ctx.moveTo(obsLeft.x, obsLeft.y);
          ctx.lineTo(obsRight.x, obsRight.y);
          ctx.lineTo(obsRight.x, obsTop.y);
          ctx.lineTo(obsLeft.x, obsTop.y);
          ctx.closePath();
          ctx.fill();

          ctx.strokeStyle = '#fda4af';
          ctx.stroke();
        }
      }

      // Ball
      const ballP = project(ballX * 110, 48, 40);
      const rad = ballRadius * ballP.scale;

      const grad = ctx.createRadialGradient(
        ballP.x - rad * 0.3,
        ballP.y - rad * 0.3,
        rad * 0.1,
        ballP.x,
        ballP.y,
        rad
      );
      grad.addColorStop(0, '#67e8f9');
      grad.addColorStop(0.5, '#06b6d4');
      grad.addColorStop(1, '#0e7490');

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(ballP.x, ballP.y, rad, 0, Math.PI * 2);
      ctx.fill();

      // Shadow
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.beginPath();
      ctx.ellipse(ballP.x, ballP.y + rad * 0.9, rad * 0.8, rad * 0.25, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    startBtn.addEventListener('click', () => {
      resetGame();
      state = 'PLAY';
      overlay.classList.add('hidden');
    });

    resetGame();
    loop();
  </script>
</body>
</html>
