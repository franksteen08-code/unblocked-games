<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Flappy Bird</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: #090d16;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #fff;
    overflow: hidden;
  }
  #game-wrap {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    border: 2px solid #1e293b;
  }
  canvas {
    display: block;
    background: #70c5ce;
  }
  .ui-bar {
    margin-top: 10px;
    font-size: 13px;
    color: #94a3b8;
    text-align: center;
  }
</style>
</head>
<body>
  <div id="game-wrap">
    <canvas id="c" width="380" height="520"></canvas>
  </div>
  <div class="ui-bar">Press <b>Space</b> or <b>Click / Tap</b> to flap</div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    let state = 'START'; // START, PLAY, GAMEOVER
    let bird = { x: 70, y: 240, vy: 0, radius: 14, angle: 0 };
    let pipes = [];
    let score = 0;
    let bestScore = parseInt(localStorage.getItem('flappy_best') || '0', 10);
    let frames = 0;
    const gravity = 0.38;
    const jump = -6.8;

    function reset() {
      bird = { x: 70, y: 240, vy: 0, radius: 14, angle: 0 };
      pipes = [];
      score = 0;
      frames = 0;
    }

    function flap() {
      if (state === 'START') {
        state = 'PLAY';
        bird.vy = jump;
      } else if (state === 'PLAY') {
        bird.vy = jump;
      } else if (state === 'GAMEOVER') {
        reset();
        state = 'PLAY';
        bird.vy = jump;
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        flap();
      }
    });

    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      flap();
    });

    function spawnPipe() {
      const gap = 125;
      const minTop = 60;
      const maxTop = canvas.height - 180 - gap;
      const topHeight = Math.floor(Math.random() * (maxTop - minTop) + minTop);
      pipes.push({
        x: canvas.width,
        top: topHeight,
        bottom: topHeight + gap,
        width: 52,
        passed: false
      });
    }

    function update() {
      frames++;

      if (state === 'PLAY') {
        bird.vy += gravity;
        bird.y += bird.vy;
        bird.angle = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, bird.vy * 0.08));

        // Floor / ceiling check
        if (bird.y + bird.radius >= canvas.height - 40) {
          bird.y = canvas.height - 40 - bird.radius;
          endGame();
        }
        if (bird.y - bird.radius <= 0) {
          bird.y = bird.radius;
          bird.vy = 0;
        }

        // Spawn pipes
        if (frames % 95 === 0) {
          spawnPipe();
        }

        // Move pipes
        for (let i = pipes.length - 1; i >= 0; i--) {
          const p = pipes[i];
          p.x -= 2.6;

          // Check score
          if (!p.passed && p.x + p.width < bird.x) {
            p.passed = true;
            score++;
            if (score > bestScore) {
              bestScore = score;
              localStorage.setItem('flappy_best', bestScore);
            }
          }

          // Check collision
          const bx = bird.x;
          const by = bird.y;
          const br = bird.radius - 2;

          if (bx + br > p.x && bx - br < p.x + p.width) {
            if (by - br < p.top || by + br > p.bottom) {
              endGame();
            }
          }

          if (p.x + p.width < -10) {
            pipes.splice(i, 1);
          }
        }
      }
    }

    function endGame() {
      state = 'GAMEOVER';
    }

    function draw() {
      // Sky
      const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      skyGrad.addColorStop(0, '#38bdf8');
      skyGrad.addColorStop(0.7, '#7dd3fc');
      skyGrad.addColorStop(1, '#bae6fd');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Clouds
      ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.beginPath();
      ctx.arc(80, 80, 28, 0, Math.PI * 2);
      ctx.arc(115, 75, 36, 0, Math.PI * 2);
      ctx.arc(150, 80, 26, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.arc(280, 120, 24, 0, Math.PI * 2);
      ctx.arc(310, 115, 30, 0, Math.PI * 2);
      ctx.arc(340, 120, 22, 0, Math.PI * 2);
      ctx.fill();

      // Pipes
      for (const p of pipes) {
        // Top pipe
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(p.x, 0, p.width, p.top);
        ctx.fillStyle = '#16a34a';
        ctx.fillRect(p.x - 3, p.top - 20, p.width + 6, 20);

        // Bottom pipe
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(p.x, p.bottom, p.width, canvas.height - 40 - p.bottom);
        ctx.fillStyle = '#16a34a';
        ctx.fillRect(p.x - 3, p.bottom, p.width + 6, 20);
      }

      // Ground
      ctx.fillStyle = '#ded895';
      ctx.fillRect(0, canvas.height - 40, canvas.width, 40);
      ctx.fillStyle = '#73bf2e';
      ctx.fillRect(0, canvas.height - 40, canvas.width, 8);

      // Bird
      ctx.save();
      ctx.translate(bird.x, bird.y);
      ctx.rotate(bird.angle);

      // Body
      ctx.fillStyle = '#f59e0b';
      ctx.beginPath();
      ctx.arc(0, 0, bird.radius, 0, Math.PI * 2);
      ctx.fill();

      // Wing
      ctx.fillStyle = '#fbbf24';
      ctx.beginPath();
      ctx.ellipse(-4, 2, 7, 5, 0, 0, Math.PI * 2);
      ctx.fill();

      // Eye
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(6, -4, 4.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(8, -4, 2, 0, Math.PI * 2);
      ctx.fill();

      // Beak
      ctx.fillStyle = '#ea580c';
      ctx.beginPath();
      ctx.moveTo(10, -2);
      ctx.lineTo(19, 2);
      ctx.lineTo(10, 6);
      ctx.closePath();
      ctx.fill();

      ctx.restore();

      // Score Display
      if (state === 'PLAY') {
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 36px sans-serif';
        ctx.textAlign = 'center';
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 4;
        ctx.strokeText(score, canvas.width / 2, 60);
        ctx.fillText(score, canvas.width / 2, 60);
      } else if (state === 'START') {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.4)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 30px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Flappy Bird', canvas.width / 2, 180);
        ctx.font = '16px sans-serif';
        ctx.fillStyle = '#f8fafc';
        ctx.fillText('Tap or press Space to fly', canvas.width / 2, 230);
      } else if (state === 'GAMEOVER') {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.65)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#ef4444';
        ctx.font = 'bold 34px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Game Over', canvas.width / 2, 170);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 20px sans-serif';
        ctx.fillText(`Score: ${score}`, canvas.width / 2, 220);
        ctx.fillStyle = '#fbbf24';
        ctx.fillText(`Best: ${bestScore}`, canvas.width / 2, 255);

        ctx.fillStyle = '#e2e8f0';
        ctx.font = '15px sans-serif';
        ctx.fillText('Tap or press Space to Retry', canvas.width / 2, 310);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    reset();
    loop();
  </script>
</body>
</html>
