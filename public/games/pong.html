<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Retro Pong</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: #090d16;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 16px;
  }
  .header {
    width: 600px;
    max-width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .title { font-size: 24px; font-weight: 800; color: #38bdf8; }
  .controls-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  select, button {
    background: #1e293b;
    border: 1px solid #334155;
    color: #f8fafc;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
  }
  #game-wrap {
    position: relative;
    width: 600px;
    height: 400px;
    max-width: 100%;
    border-radius: 12px;
    overflow: hidden;
    border: 2px solid #334155;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
  }
  canvas { background: #0f172a; display: block; width: 100%; height: 100%; }
  .info { margin-top: 10px; font-size: 12px; color: #94a3b8; }
</style>
</head>
<body>
  <div class="header">
    <div class="title">Retro Pong</div>
    <div class="controls-row">
      <select id="mode-select">
        <option value="ai-easy">1P vs AI (Easy)</option>
        <option value="ai-med" selected>1P vs AI (Normal)</option>
        <option value="ai-hard">1P vs AI (Pro)</option>
        <option value="2p">2 Players (Local)</option>
      </select>
      <button id="reset-btn">Reset</button>
    </div>
  </div>
  <div id="game-wrap">
    <canvas id="c" width="600" height="400"></canvas>
  </div>
  <div class="info">Player 1: <b>W / S</b> or <b>Mouse</b> &bull; Player 2: <b>↑ / ↓</b></div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const modeSelect = document.getElementById('mode-select');
    const resetBtn = document.getElementById('reset-btn');

    let p1 = { x: 20, y: 160, w: 10, h: 80, vy: 0, score: 0 };
    let p2 = { x: 570, y: 160, w: 10, h: 80, vy: 0, score: 0 };
    let ball = { x: 300, y: 200, r: 6, vx: 5, vy: 3 };

    let keys = {};
    window.addEventListener('keydown', e => { keys[e.code] = true; });
    window.addEventListener('keyup', e => { keys[e.code] = false; });

    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      const mouseY = ((e.clientY - rect.top) / rect.height) * canvas.height;
      p1.y = mouseY - p1.h / 2;
    });

    function resetBall(direction = 1) {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      ball.vx = direction * 4.8;
      ball.vy = (Math.random() * 4 - 2);
    }

    function resetGame() {
      p1.score = 0;
      p2.score = 0;
      resetBall();
    }

    function update() {
      // P1 Keyboard Controls
      if (keys['KeyW']) p1.y -= 6;
      if (keys['KeyS']) p1.y += 6;
      p1.y = Math.max(0, Math.min(canvas.height - p1.h, p1.y));

      // P2 Controls
      const mode = modeSelect.value;
      if (mode === '2p') {
        if (keys['ArrowUp']) p2.y -= 6;
        if (keys['ArrowDown']) p2.y += 6;
      } else {
        // AI Control
        const centerP2 = p2.y + p2.h / 2;
        let aiSpeed = 4;
        let deadZone = 12;
        if (mode === 'ai-easy') { aiSpeed = 3; deadZone = 30; }
        if (mode === 'ai-hard') { aiSpeed = 5.5; deadZone = 6; }

        if (ball.vx > 0) {
          if (ball.y < centerP2 - deadZone) p2.y -= aiSpeed;
          else if (ball.y > centerP2 + deadZone) p2.y += aiSpeed;
        }
      }
      p2.y = Math.max(0, Math.min(canvas.height - p2.h, p2.y));

      // Ball movement
      ball.x += ball.vx;
      ball.y += ball.vy;

      // Top / bottom bounce
      if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = -ball.vy; }
      if (ball.y + ball.r > canvas.height) { ball.y = canvas.height - ball.r; ball.vy = -ball.vy; }

      // P1 Paddle hit
      if (
        ball.x - ball.r <= p1.x + p1.w &&
        ball.x + ball.r >= p1.x &&
        ball.y >= p1.y &&
        ball.y <= p1.y + p1.h &&
        ball.vx < 0
      ) {
        ball.vx = -ball.vx * 1.05;
        const offset = (ball.y - (p1.y + p1.h / 2)) / (p1.h / 2);
        ball.vy = offset * 5;
      }

      // P2 Paddle hit
      if (
        ball.x + ball.r >= p2.x &&
        ball.x - ball.r <= p2.x + p2.w &&
        ball.y >= p2.y &&
        ball.y <= p2.y + p2.h &&
        ball.vx > 0
      ) {
        ball.vx = -ball.vx * 1.05;
        const offset = (ball.y - (p2.y + p2.h / 2)) / (p2.h / 2);
        ball.vy = offset * 5;
      }

      // Score
      if (ball.x < 0) {
        p2.score++;
        resetBall(1);
      } else if (ball.x > canvas.width) {
        p1.score++;
        resetBall(-1);
      }
    }

    function draw() {
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Center dotted line
      ctx.strokeStyle = '#334155';
      ctx.setLineDash([8, 8]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // Scores
      ctx.font = 'bold 36px monospace';
      ctx.fillStyle = '#64748b';
      ctx.textAlign = 'center';
      ctx.fillText(p1.score, canvas.width / 4, 60);
      ctx.fillText(p2.score, (canvas.width * 3) / 4, 60);

      // Paddles
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(p1.x, p1.y, p1.w, p1.h);
      ctx.fillStyle = '#f43f5e';
      ctx.fillRect(p2.x, p2.y, p2.w, p2.h);

      // Ball
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    resetBtn.addEventListener('click', resetGame);
    resetBall();
    loop();
  </script>
</body>
</html>
