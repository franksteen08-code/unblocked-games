<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Snake Classic</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: #090d16;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 16px;
  }
  .header {
    width: 400px;
    max-width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .title {
    font-size: 28px;
    font-weight: 800;
    color: #22c55e;
    letter-spacing: -0.5px;
  }
  .scores {
    display: flex;
    gap: 10px;
  }
  .badge {
    background: #1e293b;
    border: 1px solid #334155;
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
  }
  #game-container {
    position: relative;
    width: 400px;
    height: 400px;
    max-width: 100%;
    border-radius: 12px;
    overflow: hidden;
    border: 2px solid #334155;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
  }
  canvas {
    background: #0f172a;
    display: block;
    width: 100%;
    height: 100%;
  }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(15, 23, 42, 0.88);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  .overlay.active { display: flex; }
  .btn {
    background: #22c55e;
    color: #0f172a;
    font-weight: 700;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
  }
  .btn:hover { background: #16a34a; }
  .info {
    margin-top: 12px;
    font-size: 12px;
    color: #94a3b8;
  }
</style>
</head>
<body>
  <div class="header">
    <div class="title">Retro Snake</div>
    <div class="scores">
      <div class="badge">Score: <span id="score" style="color:#22c55e;">0</span></div>
      <div class="badge">Best: <span id="best" style="color:#38bdf8;">0</span></div>
    </div>
  </div>
  <div id="game-container">
    <canvas id="c" width="400" height="400"></canvas>
    <div class="overlay" id="overlay">
      <h2 style="font-size:24px; font-weight:800; color:#ef4444;" id="status-title">Game Over!</h2>
      <p id="final-score" style="font-size:15px; color:#cbd5e1;">Score: 0</p>
      <button class="btn" id="start-btn">Play Again</button>
    </div>
  </div>
  <div class="info">Use <b>Arrow Keys</b> or <b>WASD</b> to steer</div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const overlay = document.getElementById('overlay');
    const statusTitle = document.getElementById('status-title');
    const finalScore = document.getElementById('final-score');
    const startBtn = document.getElementById('start-btn');

    const gridSize = 20;
    const tileCount = 20; // 400 / 20 = 20
    let snake = [];
    let food = { x: 5, y: 5 };
    let dx = 1;
    let dy = 0;
    let nextDx = 1;
    let nextDy = 0;
    let score = 0;
    let bestScore = parseInt(localStorage.getItem('snake_best') || '0', 10);
    bestEl.textContent = bestScore;
    let gameInterval = null;
    let isGameOver = false;

    function init() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      dx = 1;
      dy = 0;
      nextDx = 1;
      nextDy = 0;
      score = 0;
      scoreEl.textContent = score;
      isGameOver = false;
      overlay.classList.remove('active');
      placeFood();
      clearInterval(gameInterval);
      gameInterval = setInterval(gameStep, 100);
      draw();
    }

    function placeFood() {
      let valid = false;
      while (!valid) {
        food = {
          x: Math.floor(Math.random() * tileCount),
          y: Math.floor(Math.random() * tileCount)
        };
        valid = !snake.some(segment => segment.x === food.x && segment.y === food.y);
      }
    }

    function gameStep() {
      if (isGameOver) return;
      dx = nextDx;
      dy = nextDy;

      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      // Wall collision
      if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        gameOver();
        return;
      }

      // Self collision
      if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
        gameOver();
        return;
      }

      snake.unshift(head);

      // Eat food
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        if (score > bestScore) {
          bestScore = score;
          bestEl.textContent = bestScore;
          localStorage.setItem('snake_best', bestScore);
        }
        placeFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function gameOver() {
      isGameOver = true;
      clearInterval(gameInterval);
      statusTitle.textContent = 'Game Over!';
      finalScore.textContent = `You scored: ${score}`;
      overlay.classList.add('active');
    }

    function draw() {
      // Background Grid
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 1;
      for (let i = 0; i <= tileCount; i++) {
        ctx.beginPath();
        ctx.moveTo(i * gridSize, 0);
        ctx.lineTo(i * gridSize, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i * gridSize);
        ctx.lineTo(canvas.width, i * gridSize);
        ctx.stroke();
      }

      // Food
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(food.x * gridSize + gridSize / 2, food.y * gridSize + gridSize / 2, gridSize / 2 - 2, 0, Math.PI * 2);
      ctx.fill();

      // Snake
      snake.forEach((segment, i) => {
        ctx.fillStyle = i === 0 ? '#4ade80' : '#22c55e';
        ctx.fillRect(segment.x * gridSize + 1, segment.y * gridSize + 1, gridSize - 2, gridSize - 2);
      });
    }

    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'KeyW'].includes(e.code) && dy === 0) { e.preventDefault(); nextDx = 0; nextDy = -1; }
      if (['ArrowDown', 'KeyS'].includes(e.code) && dy === 0) { e.preventDefault(); nextDx = 0; nextDy = 1; }
      if (['ArrowLeft', 'KeyA'].includes(e.code) && dx === 0) { e.preventDefault(); nextDx = -1; nextDy = 0; }
      if (['ArrowRight', 'KeyD'].includes(e.code) && dx === 0) { e.preventDefault(); nextDx = 1; nextDy = 0; }
    });

    startBtn.addEventListener('click', init);
    init();
  </script>
</body>
</html>
