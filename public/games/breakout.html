<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Breakout Neon</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: #090d16;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 16px;
  }
  .header {
    width: 460px;
    max-width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .title { font-size: 24px; font-weight: 800; color: #f43f5e; }
  .badge { background: #1e293b; padding: 4px 10px; border-radius: 6px; font-size: 13px; font-weight: 600; border: 1px solid #334155; }
  #canvas-container {
    position: relative;
    width: 460px;
    height: 480px;
    max-width: 100%;
    border-radius: 12px;
    overflow: hidden;
    border: 2px solid #334155;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
  }
  canvas { background: #0f172a; display: block; width: 100%; height: 100%; }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(15, 23, 42, 0.9);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  .overlay.active { display: flex; }
  .btn {
    background: #f43f5e;
    color: #fff;
    font-weight: 700;
    border: none;
    padding: 10px 22px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
  }
  .btn:hover { background: #e11d48; }
  .info { margin-top: 10px; font-size: 12px; color: #94a3b8; }
</style>
</head>
<body>
  <div class="header">
    <div class="title">Neon Breakout</div>
    <div style="display:flex; gap:8px;">
      <div class="badge">Score: <span id="score" style="color:#f43f5e;">0</span></div>
      <div class="badge">Lives: <span id="lives" style="color:#38bdf8;">3</span></div>
    </div>
  </div>
  <div id="canvas-container">
    <canvas id="c" width="460" height="480"></canvas>
    <div class="overlay" id="overlay">
      <h2 style="font-size:24px; font-weight:800; color:#fff;" id="over-title">Game Over</h2>
      <p id="over-desc" style="color:#94a3b8; font-size:14px;">Try again!</p>
      <button class="btn" id="start-btn">Start Game</button>
    </div>
  </div>
  <div class="info">Move mouse / finger or press <b>Left/Right Arrow</b> to steer paddle</div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const overlay = document.getElementById('overlay');
    const overTitle = document.getElementById('over-title');
    const overDesc = document.getElementById('over-desc');
    const startBtn = document.getElementById('start-btn');

    let paddle = { w: 90, h: 12, x: 185, y: 445, speed: 7 };
    let ball = { x: 230, y: 350, r: 6, vx: 3.5, vy: -3.5 };
    let bricks = [];
    let score = 0;
    let lives = 3;
    let running = false;
    let rightPressed = false;
    let leftPressed = false;

    const rowColors = ['#f43f5e', '#fb923c', '#facc15', '#4ade80', '#38bdf8'];

    function createBricks() {
      bricks = [];
      const rows = 5;
      const cols = 7;
      const bw = 54;
      const bh = 18;
      const pad = 8;
      const leftOffset = 18;
      const topOffset = 35;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          bricks.push({
            x: leftOffset + c * (bw + pad),
            y: topOffset + r * (bh + pad),
            w: bw,
            h: bh,
            color: rowColors[r],
            alive: true,
            pts: (rows - r) * 10
          });
        }
      }
    }

    function init() {
      score = 0;
      lives = 3;
      scoreEl.textContent = score;
      livesEl.textContent = lives;
      paddle.x = (canvas.width - paddle.w) / 2;
      resetBall();
      createBricks();
      running = true;
      overlay.classList.remove('active');
    }

    function resetBall() {
      ball.x = paddle.x + paddle.w / 2;
      ball.y = paddle.y - 10;
      ball.vx = (Math.random() > 0.5 ? 1 : -1) * 3.5;
      ball.vy = -3.8;
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'ArrowRight' || e.code === 'KeyD') rightPressed = true;
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') leftPressed = true;
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowRight' || e.code === 'KeyD') rightPressed = false;
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') leftPressed = false;
    });

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const rootX = e.clientX - rect.left;
      paddle.x = (rootX / rect.width) * canvas.width - paddle.w / 2;
      clampPaddle();
    });

    canvas.addEventListener('touchmove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const rootX = e.touches[0].clientX - rect.left;
      paddle.x = (rootX / rect.width) * canvas.width - paddle.w / 2;
      clampPaddle();
    }, {passive: true});

    function clampPaddle() {
      if (paddle.x < 0) paddle.x = 0;
      if (paddle.x + paddle.w > canvas.width) paddle.x = canvas.width - paddle.w;
    }

    function update() {
      if (!running) return;

      if (rightPressed) paddle.x += paddle.speed;
      if (leftPressed) paddle.x -= paddle.speed;
      clampPaddle();

      ball.x += ball.vx;
      ball.y += ball.vy;

      // Wall bounce
      if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = -ball.vx; }
      if (ball.x + ball.r > canvas.width) { ball.x = canvas.width - ball.r; ball.vx = -ball.vx; }
      if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = -ball.vy; }

      // Paddle bounce
      if (
        ball.y + ball.r >= paddle.y &&
        ball.y - ball.r <= paddle.y + paddle.h &&
        ball.x >= paddle.x &&
        ball.x <= paddle.x + paddle.w &&
        ball.vy > 0
      ) {
        const hitOffset = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
        ball.vx = hitOffset * 4.5;
        ball.vy = -Math.abs(ball.vy);
      }

      // Brick collisions
      let remaining = 0;
      for (const b of bricks) {
        if (!b.alive) continue;
        remaining++;
        if (
          ball.x + ball.r > b.x &&
          ball.x - ball.r < b.x + b.w &&
          ball.y + ball.r > b.y &&
          ball.y - ball.r < b.y + b.h
        ) {
          b.alive = false;
          ball.vy = -ball.vy;
          score += b.pts;
          scoreEl.textContent = score;
          remaining--;
          break;
        }
      }

      // All cleared
      if (remaining === 0) {
        running = false;
        overTitle.textContent = 'You Won!';
        overDesc.textContent = `Magnificent! Final Score: ${score}`;
        overlay.classList.add('active');
      }

      // Bottom death
      if (ball.y - ball.r > canvas.height) {
        lives--;
        livesEl.textContent = lives;
        if (lives <= 0) {
          running = false;
          overTitle.textContent = 'Game Over';
          overDesc.textContent = `Final Score: ${score}`;
          overlay.classList.add('active');
        } else {
          resetBall();
        }
      }
    }

    function draw() {
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Bricks
      for (const b of bricks) {
        if (!b.alive) continue;
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.roundRect(b.x, b.y, b.w, b.h, 4);
        ctx.fill();
      }

      // Paddle
      ctx.fillStyle = '#f43f5e';
      ctx.beginPath();
      ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 6);
      ctx.fill();

      // Ball
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    startBtn.addEventListener('click', init);
    init();
    loop();
  </script>
</body>
</html>
